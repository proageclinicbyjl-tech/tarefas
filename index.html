<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2a2420"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PROAGE">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
<title>Tarefas PROAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de topo castanha com 3 separadores; por baixo, colunas lado a lado (uma por pessoa ou por área) com cartões simples */
:root{
 --ink:#2a2420;--soft:#7d7066;--line:#e6dccf;--paper:#fbf7f1;--card:#ffffff;--colbg:#f3ece2;--gold:#b08d57;--gold2:#d7b98a;--bar:#2a2420;--bartx:#efe6da;--barmute:#bfae9a;
 --red:#d6453a;--redbg:#fdecea;--amber:#b7791f;--amberbg:#fdf3e1;--green:#2e7a47;--greenbg:#e8f3ec;--blue:#3a6fb0;--bluebg:#e9f0f9;
 --serif:Fraunces,Georgia,serif;--sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1e9df;--soft:#b3a594;--line:#3d342d;--paper:#1c1815;--card:#26211c;--colbg:#211c18;--gold:#d7b98a;--bar:#141110;--redbg:#3a1f1c;--amberbg:#3a2e17;--greenbg:#1c3226;--bluebg:#1d2a3b;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f1e9df;--soft:#b3a594;--line:#3d342d;--paper:#1c1815;--card:#26211c;--colbg:#211c18;--gold:#d7b98a;--bar:#141110;--redbg:#3a1f1c;--amberbg:#3a2e17;--greenbg:#1c3226;--bluebg:#1d2a3b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* topo */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bartx);display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:3px;color:var(--gold2);white-space:nowrap}
.brand span{font-family:var(--sans);font-size:10px;letter-spacing:2.5px;color:var(--barmute);margin-left:8px;text-transform:uppercase;font-weight:600}
.tabs{display:flex;gap:6px}
.tabs button{background:transparent;color:var(--bartx);border:1px solid rgba(215,185,138,.45);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px}
.tabs button:hover{border-color:var(--gold2)}
.tabs button.on{background:var(--gold2);color:#2a2420;border-color:var(--gold2)}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.new{background:var(--gold2);color:#2a2420;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13.5px}
.who{display:flex;align-items:center;gap:8px;background:none;border:1px solid rgba(215,185,138,.3);border-radius:999px;padding:4px 12px 4px 4px;color:var(--bartx);font-size:13px}
.who small{color:var(--barmute)}
/* coluna lateral */
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);height:calc(100vh - 62px);overflow:auto;padding:20px 12px 24px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.side .lb{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--soft);margin:14px 10px 4px}
.side .lb:first-child{margin-top:0}
.si{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:9px 10px;text-align:left;font-weight:500;color:var(--ink);width:100%}
.si:hover{background:var(--colbg)}
.si.on{background:var(--ink);color:var(--paper);font-weight:600}
.si.ar.on{background:var(--colbg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.si .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--soft)}
.si.on .n{color:var(--gold2)}
.si .n.r{color:#fff;background:var(--red);border-radius:999px;padding:0 7px}
.si .ic{width:16px;text-align:center;flex:none;opacity:.8}
.si .dot{width:9px;height:9px;margin:0 3px}
.side .ql{margin-top:auto;font-size:11.5px;color:var(--soft);padding:14px 10px 0;line-height:1.5}
.side .ql a{color:var(--gold);font-weight:600}
/* página */
.page{padding-block:20px 50px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--soft);margin:4px 0 0}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--soft)}
.seg button.on{background:var(--ink);color:var(--paper)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:-4px 0 16px}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;color:var(--soft);flex:0 1 300px;min-width:200px}
.srch:focus-within{border-color:var(--gold)}
.srch input{border:0;background:none;outline:none;padding:8px 0;width:100%;color:var(--ink)}
.adrop{position:relative}
.car{font-size:10px;opacity:.7;margin-left:2px}
.amenu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(42,36,32,.14);padding:6px;min-width:200px;display:flex;flex-direction:column}
.amenu button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left;font-size:13px;font-weight:500}
.amenu button:hover{background:var(--colbg)}
.amenu button.on{font-weight:700}
.amenu .dot{margin:0}
.ach{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.ach:hover{border-color:var(--gold)}
.ach.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ach .dot{margin:0}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
/* colunas */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--colbg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.col.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.ch{display:flex;gap:10px;align-items:center;padding:2px 2px 6px}
.ch b{display:block;font-size:15px;line-height:1.2}
.ch small{display:block;color:var(--soft);font-size:11.5px;line-height:1.3}
.cnt{font-size:12px;color:var(--soft);display:flex;gap:10px;padding:0 2px 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.cnt .r{color:var(--red);font-weight:700}
.grp{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--soft);margin:6px 2px 0}
.grp.r{color:var(--red)}
.empty{color:var(--soft);font-size:12.5px;padding:10px 4px;text-align:center}
.add{display:flex;gap:6px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:2px 4px 2px 10px;margin-top:auto;background:transparent}
.add input{flex:1;border:0;background:none;padding:7px 0;outline:none;font-size:13px;min-width:0}
.add span{color:var(--gold);font-weight:700}
.add:focus-within{border-style:solid;border-color:var(--gold);background:var(--card)}
/* cartão */
.t{display:flex;gap:9px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(42,36,32,.04)}
.t:hover{border-color:var(--gold)}
.t.sug{border-style:dashed}
.t.done{opacity:.55}.t.done .tt{text-decoration:line-through}
.ck{width:19px;height:19px;border-radius:50%;border:2px solid var(--soft);background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.ck:hover{border-color:var(--green);background:var(--greenbg)}
.t.done .ck{background:var(--green);border-color:var(--green)}
.ck svg{width:11px;height:11px;color:#fff}
.tb{min-width:0;flex:1}
.tt{font-weight:600;font-size:13.5px;line-height:1.35}
.tt .urg{color:var(--red);font-weight:800;margin-right:4px}
.ml{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:11.5px;color:var(--soft);align-items:center}
.d.late{color:var(--red);font-weight:700}.d.today{color:var(--amber);font-weight:700}
.tag{border-radius:999px;padding:1px 7px;font-weight:600}
.tag.wait{background:var(--bluebg);color:var(--blue)}.tag.go{background:var(--greenbg);color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.s{width:20px;height:20px;font-size:8.5px}.av.l{width:56px;height:56px;font-size:19px}
/* minhas */
.mine{max-width:760px}
.mine .list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.mine h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 8px}
.mine h2.r{color:var(--red)}
.big{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:22px}
.big input{flex:1;border:0;background:none;outline:none;padding:8px 0;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prog{height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin:2px 2px 4px}.prog i{display:block;height:100%;background:var(--gold)}
/* gaveta */
.ov{position:fixed;inset:0;background:rgba(20,16,14,.45);display:flex;justify-content:flex-end;z-index:50}
.drawer{background:var(--paper);width:min(480px,100%);height:100%;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px 20px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--soft);font-weight:700}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;font-weight:600}
.pp.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.labh{font-weight:500;color:var(--soft);font-size:11.5px;text-transform:none;letter-spacing:0;margin-left:4px}
.qmode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.qm{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--ink)}
.qm b{font-size:13px}.qm small{color:var(--soft);font-size:11.5px;line-height:1.35}
.qm.on{border-color:var(--gold);background:#f6efe4;box-shadow:0 0 0 2px rgba(176,141,87,.2)}
.whos{display:inline-flex;align-items:center;gap:5px}.avs{display:inline-flex}.avs .av{box-shadow:0 0 0 2px var(--card)}.avs .av+.av{margin-left:-6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.op{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.op.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details{border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;font-weight:600;color:var(--soft);font-size:13px}
details[open] summary{margin-bottom:12px}
.dg{display:flex;flex-direction:column;gap:14px}
.cl{display:flex;flex-direction:column;gap:4px}
.cl label{display:flex;gap:8px;align-items:center;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cl label input[type=text]{flex:1;border:0;background:none;padding:0;outline:none}
.x{background:none;border:0;color:var(--soft);padding:0 2px}
.cm div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.cm small{color:var(--soft);display:block;font-size:11px}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
/* quem és */
.pick{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px max(16px,env(safe-area-inset-left,0px))}
.pick h2{font-family:var(--serif);font-size:30px;margin:0;text-align:center}
.pick .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:min(760px,100%)}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pick button:hover{border-color:var(--gold)}
.pick button b{font-size:15px}.pick button small{color:var(--soft);font-size:11.5px;text-align:center;line-height:1.3}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13px;z-index:70;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--gold2);font-weight:700}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px 16px;gap:4px}.side .lb,.side .ql{display:none}.si{width:auto;padding:7px 11px;background:var(--card);border:1px solid var(--line)}}
@media (max-width:760px){.bar .right{margin-left:0;width:100%;justify-content:space-between}.cols{grid-auto-columns:85%}h1{font-size:23px}}
/* caixa de entrada: mensagens que exigem atenção, no topo do «O meu dia» */
.tabs .bd{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.who{cursor:default}
.who .mg{background:var(--gold2);color:#2a2420;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.dayg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;max-width:1200px}
.inbox{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ibh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ibh h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:0}
.ibh .lnk{margin-left:auto;background:none;border:0;color:var(--soft);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.ibt{display:inline-flex;background:var(--colbg);border-radius:999px;padding:3px;gap:2px}
.ibt button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--soft)}
.ibt button.on{background:var(--ink);color:var(--paper)}
.ibt b{color:var(--red);margin-left:3px}
.ibt button.on b{color:var(--gold2)}
.msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.msg:last-child{border-bottom:0}
.msg.un{background:linear-gradient(90deg,rgba(214,69,58,.06),transparent 60%)}
.msg.un::before{content:"";position:absolute;left:5px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.msg.p1.un::before{background:var(--red)}.msg.p2.un::before{background:var(--amber)}.msg.p3.un::before,.msg.p4.un::before,.msg.p5.un::before{background:var(--blue)}
.msg .mt{font-size:13.5px;line-height:1.4}
.msg .mt b{font-weight:700}
.msg .mq{display:block;margin-top:4px;padding:6px 10px;border-left:3px solid var(--line);color:var(--soft);font-size:12.5px;background:var(--paper);border-radius:0 8px 8px 0}
.msg .mm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--soft)}
.msg .kd{font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-size:10px;border-radius:999px;padding:1px 7px}
.kd.k1{background:var(--redbg);color:var(--red)}.kd.k2{background:var(--amberbg);color:var(--amber)}.kd.k3{background:var(--bluebg);color:var(--blue)}.kd.k5{background:var(--greenbg);color:var(--green)}
.ma{display:flex;gap:6px;margin-left:auto}
.ma button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
.ma button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ma button:hover{border-color:var(--gold)}
.ibe{padding:26px 16px;text-align:center;color:var(--soft)}
.ibe b{display:block;font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:2px}
.seen{border-top:1px solid var(--line)}
.seen summary{padding:10px 16px;font-size:12.5px}
.seen[open] summary{margin:0}
.seen .msg{opacity:.62}
/* só leitura */
.t.ro{cursor:default;background:transparent;box-shadow:none}
.t.ro:hover{border-color:var(--line)}
.t.ro .ck{visibility:hidden}
.t.ro.done .ck{visibility:visible}
.lock{font-size:11px;color:var(--soft);display:inline-flex;align-items:center;gap:4px}
.rob{display:inline-flex;align-items:center;gap:6px;background:var(--colbg);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--soft);font-weight:600}
.fld .note{font-size:12px;color:var(--soft)}
.fld input:disabled,.fld textarea:disabled,.fld select:disabled{opacity:.65}
.pp:disabled,.op:disabled{opacity:.5;cursor:not-allowed}
/* entrada */
.gate{max-width:560px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate h2{font-family:var(--serif);font-size:24px;margin:0}
.gate p{margin:0;color:var(--soft)}
.acc{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
@media (max-width:980px){.dayg{grid-template-columns:1fr}}
.wrap.solo{grid-template-columns:1fr}
.pk{max-width:680px;margin:6vh auto 40px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-shadow:0 10px 30px rgba(42,36,32,.06)}
.pk0{margin:0;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.pk h2{font-family:var(--serif);font-weight:600;font-size:32px;margin:6px 0 6px}
.pk1{margin:0 0 22px;color:var(--soft);max-width:46ch}

<script>
(()=>{
const P=[
 {id:'joana',n:'Dra. Joana',r:'CEO',a:'negocio',c:'#2a2420'},
 {id:'jhennyfer',n:'Jhennyfer',r:'Gestão',a:'operacional',c:'#8a6a3d'},
 {id:'flavia',n:'Flávia',r:'Leads e marcações',a:'comercial',c:'#b0563f'},
 {id:'brenda',n:'Brenda',r:'Receção e stock',a:'operacional',c:'#4f7a5c'},
 {id:'mariana',n:'Mariana',r:'Felicidade',a:'pessoas',c:'#a86e8f',x:1},
 {id:'eduarda',n:'Eduarda',r:'Estratégia',a:'negocio',c:'#3f6b8f',x:1},
 {id:'luz',n:'Luz',r:'Marketing, Meta e CRM',a:'marketing',c:'#7b5ea7',x:1}];
/* quem pode criar, passar e mudar tarefas de toda a gente */
const MGR=['joana','eduarda','mariana','jhennyfer'];
const A=[{id:'negocio',n:'Negócio',c:'#2a2420'},{id:'comercial',n:'Comercial',c:'#b0563f'},{id:'marketing',n:'Marketing',c:'#3f6b8f'},{id:'operacional',n:'Operacional',c:'#4f7a5c'},{id:'pessoas',n:'Pessoas',c:'#a86e8f'}];
const PROC=['Leads: chamadas e mensagens','Marcação e confirmação no Zappy','Chegada: RGPD, ficha e fotografias','Consulta e checkout','Pacientes: mensagens e seguimento','Vouchers','Proage Academy: pedidos de formação','Médicas: entrada e saída','Funcionárias: entrada e primeiros dias','Fecho do dia e do mês','Comissões das médicas','Marketing: conteúdo e links de WhatsApp','Licenças e obrigações legais','Horários: fecho do mês das médicas','O teu dia: abertura, durante o dia e fecho','Stock e encomendas','Esterilização do material','Raio-X portátil','Filtros do AC'];
const ST={afazer:'Por fazer',curso:'A fazer agora',espera:'À espera de alguém',feito:'Feito'};
const REC={'':'Não repete',diaria:'Todos os dias úteis',semanal:'Todas as semanas',mensal:'Todos os meses'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const per=id=>P.find(p=>p.id===id)||{id,n:'Sem pessoa',c:'#999',r:'',a:'operacional'};
const area=id=>A.find(a=>a.id===id)||{id,n:'Sem área',c:'#999'};
const ini=n=>n.replace('Dra. ','').slice(0,1).toUpperCase();
const av=(id,cls='')=>{const p=per(id);return `<span class="av ${cls}" style="background:${p.c}" aria-hidden="true">${ini(p.n)}</span>`};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const DOW=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtD=s=>{if(!s)return'';const t=TODAY();if(s===t)return'Hoje';if(s===addD(t,1))return'Amanhã';if(s===addD(t,-1))return'Ontem';const d=new Date(s+'T12:00');const diff=(d-new Date(t+'T12:00'))/864e5;return diff>0&&diff<7?DOW[d.getDay()][0].toUpperCase()+DOW[d.getDay()].slice(1):d.getDate()+'/'+(d.getMonth()+1)};
const ago=ms=>{const m=Math.round((Date.now()-ms)/6e4);if(m<1)return'agora';if(m<60)return`há ${m} min`;const h=Math.round(m/60);if(h<24)return`há ${h} h`;const d=Math.round(h/24);return d===1?'ontem':`há ${d} dias`};
const endWeek=()=>{let d=TODAY();while(new Date(d+'T12:00').getDay()!==6)d=addD(d,1);return d};
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const LOCK='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
const DAY=864e5;

/* ---------- estado ---------- */
let aOpen=false,view='meu',when='hoje',fA='',q='',db=null,user=null,loaded=false,offline=false,editing=null,ibTab='mim',ibOpen=false,wOpen=false;
let uid=null,admin=false,me=null,TB=[],MEM={},PED={},OV={},NV={},LID={},names={},subs={},lidRef=null;
try{const v=sessionStorage.getItem('tp_view');if(v)view=v;const b=sessionStorage.getItem('tp_ib');if(b)ibTab=b}catch(e){}
let instEvt=null;const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;try{render()}catch(x){}});window.addEventListener('appinstalled',()=>{instEvt=null;try{toast('App instalada')}catch(x){}});
const canInstall=()=>!isStandalone()&&(!!instEvt||isIOS);
const isMgr=()=>!!me&&admin&&MGR.includes(me);
const approved=()=>!!me;
const uidsOf=p=>Object.keys(MEM).filter(u=>MEM[u]===p);
const quemTodos=t=>[t.quem,...(t.com||[]).filter(x=>x&&x!==t.quem)];
const has=(t,p)=>t.quem===p||(t.com||[]).includes(p);
const quemNomes=t=>quemTodos(t).map(x=>per(x).n.replace(/^Dra?\. /,'')).join(', ');

/* junta as tarefas da gestão (tasks), o que cada pessoa mudou nas suas (t/<id>/ov) e as que criou para si (t/<id>/n) */
let T=[];
function build(){
 const out=[];
 for(const b of TB){const t={...b,_src:'base',comentarios:[...(b.comentarios||[])]};
  for(const u of quemTodos(t).flatMap(uidsOf)){const o=(OV[u]||{})[t.id];if(!o)continue;
   if((o.at||0)>(t.estado_at||t.criado||0)){t.estado=o.estado;t.feito_em=o.feito_em||null;t.feito_por=o.feito_por||null;t.espera_por=o.espera_por||null;t.atualizado=o.at}
   if(o.checklist&&(o.ck_at||0)>(t.ck_at||0))t.checklist=o.checklist;
   if(o.comentarios)t.comentarios.push(...o.comentarios)}
  t.comentarios.sort((a,b)=>a.at-b.at);out.push(t)}
 for(const u in NV){const p=MEM[u];if(!p)continue;for(const n of NV[u])out.push({...n,quem:p,_src:'nv',_uid:u})}
 T=out}
const canEditT=t=>isMgr()||(approved()&&has(t,me));

const open=t=>t.estado!=='feito';
const late=t=>open(t)&&t.prazo&&t.prazo<TODAY();
const forToday=t=>open(t)&&t.prazo&&t.prazo<=TODAY();
const sortT=(a,b)=>(late(b)-late(a))||((a.prioridade==='alta'?0:1)-(b.prioridade==='alta'?0:1))||String(a.prazo||'9').localeCompare(String(b.prazo||'9'))||(a.criado||0)-(b.criado||0);
const doneToday=t=>t.estado==='feito'&&t.feito_em&&iso(new Date(t.feito_em))===TODAY();
const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function pick(arr){return pick0(arr).filter(t=>!q||norm(t.titulo+' '+(t.notas||'')+' '+quemNomes(t)).includes(norm(q)))}
function pick0(arr){if(when==='atrasadas')return arr.filter(late);if(when==='espera')return arr.filter(t=>t.estado==='espera');if(when==='hoje')return arr.filter(t=>forToday(t)||doneToday(t)||(open(t)&&!t.prazo&&t.prioridade==='alta'));if(when==='semana')return arr.filter(t=>open(t)&&t.prazo&&t.prazo<=endWeek());if(when==='tudo')return arr.filter(open);return arr.filter(t=>t.estado==='feito'&&t.feito_em&&Date.now()-t.feito_em<14*DAY)}

/* ---------- gravar ---------- */
const clean=t=>{const o={};for(const k in t)if(k!=='id'&&k[0]!=='_')o[k]=t[k]===undefined?null:t[k];return o};
const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function put(path,data){if(!db)throw new Error('offline');await db.doc(path).set(data)}
async function del(path){if(!db)throw new Error('offline');await db.doc(path).delete()}
/* prev = como estava; t = como fica */
async function save(t,prev){
 if(!canEditT(prev||t)||!canEditT(t)){toast('Só podes mexer nas tuas tarefas.');return false}
 t.atualizado=Date.now();
 const now=Date.now(),stCh=!prev||prev.estado!==t.estado||(prev.espera_por||null)!==(t.espera_por||null),ckCh=!prev||JSON.stringify(prev.checklist||[])!==JSON.stringify(t.checklist||[]);
 // vista imediata
 const i=T.findIndex(x=>x.id===t.id);if(i<0)T.push(t);else T[i]=t;render();
 try{
  if(isMgr()){
   if(t._src==='nv'&&prev&&prev.quem!==t.quem){ // passar uma tarefa pessoal para outra pessoa: passa a ser da gestão
    await put('tasks/'+t.id,{...clean(t),estado_at:now,ck_at:now});await del(`t/${t._uid}/n/${t.id}`)}
   else if(t._src==='nv')await put(`t/${t._uid}/n/${t.id}`,clean(t));
   else{const base=TB.find(x=>x.id===t.id)||{};const o=clean(t);
    // a conversa da própria pessoa fica no espaço dela; aqui só a da gestão e a de quem não está ligada
    const own=new Set(quemTodos(t).flatMap(uidsOf).flatMap(u=>(((OV[u]||{})[t.id]||{}).comentarios||[]).map(c=>c.at+'|'+c.t)));
    o.comentarios=(t.comentarios||[]).filter(c=>!own.has(c.at+'|'+c.t));
    o.estado_at=stCh?now:(base.estado_at||null);o.ck_at=ckCh?now:(base.ck_at||null);
    await put('tasks/'+t.id,o)}

 const pn=e.target.closest('[data-pinew]');if(pn){const n=PI.length,id='pi_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);let p;

  else{const bd=$('#pib'),w=bd?bd.clientWidth:340,cols=Math.max(1,Math.floor(w/160));p={id,t:'',c:pn.dataset.pinew,x:((n%cols)*160+8)/w*100,y:Math.floor(n/cols)*160+8,z:n+1}}
  piNew=p.id;PI.push(p);render();piNew=null;{const t=document.getElementById('k_pi_'+p.id);t&&t.focus()}savePi(p);return}
 const pdl=e.target.closest('[data-pidel]');if(pdl){const id=pdl.dataset.pidel,p=PI.find(x=>x.id===id);if(!p)return;PI=PI.filter(x=>x.id!==id);render();del(`data/users/${uid}/${id}`).catch(()=>toast('Não foi possível apagar'));
  toast('Post-it apagado',()=>{PI.push(p);savePi(p);render()});return}
});
const instHide=()=>{try{return localStorage.getItem('tp_inst_no')==='1'}catch(e){return false}};
async function doInstall(){wOpen=false;if(instEvt){instEvt.prompt();try{await instEvt.userChoice}catch(e){}instEvt=null;render();return}
 if(isIOS)$('#ovl').innerHTML=`<div class="ov" id="ovI" style="justify-content:center;align-items:center"><div class="insth"><img src="apple-touch-icon.png" alt="" width="64" height="64"><h2>Instalar no iPhone</h2><ol><li>Abre esta página no <b>Safari</b>.</li><li>Toca em <b>Partilhar</b> <span aria-hidden="true">(o quadrado com a seta para cima)</span>.</li><li>Escolhe <b>Adicionar ao ecrã principal</b> e depois <b>Adicionar</b>.</li></ol><button class="btn pri" data-insclose>Percebi</button></div></div>`}
document.addEventListener('click',e=>{if(e.target.closest('[data-install]')){e.preventDefault();doInstall();return}
 if(e.target.closest('[data-insthide]')){try{localStorage.setItem('tp_inst_no','1')}catch(x){}render();return}
 if(e.target.closest('[data-insclose]')||e.target.id==='ovI'){$('#ovl').innerHTML=''}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('submit',async e=>{
 const f=e.target.closest('[data-send]');if(f){e.preventDefault();const t=$('#k_chat');if(!t||!t.value.trim())return;const v=t.value,voz=vozIds.has('k_chat');vozIds.delete('k_chat');stopMic();t.value='';
  if(!(f.dataset.send==='ideias'?await newIde(v,me,voz):await sendTyped(f.dataset.send,v,voz))){const t2=$('#k_chat');if(t2)t2.value=v}else{const t2=$('#k_chat');if(t2&&matchMedia('(min-width:761px)').matches)t2.focus()}return}
 const n=e.target.closest('[data-ideanew]');if(n){e.preventDefault();const t=$('#k_idea');if(!t||!t.value.trim())return;const v=t.value,voz=vozIds.has('k_idea');vozIds.delete('k_idea');stopMic();t.value='';if(!await newIde(v,me,voz)){const t2=$('#k_idea');if(t2)t2.value=v}else{ideTab='novas';render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='k_chat'&&matchMedia('(hover:hover)').matches){e.preventDefault();e.target.closest('form').requestSubmit()}});
document.addEventListener('input',e=>{if(e.target.id==='k_chat'||e.target.id==='iM'){const t=e.target;t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastSeenAt=Date.now();if(chatOpen&&chatK&&chatK!=='ideias'&&unreadOf(chatK))markRead(chatK)}});
setInterval(()=>{if(document.hidden)return;lastSeenAt=Date.now()},4000);

/* ---------- base partilhada ---------- */
let rq=0;const later=()=>{if(rq||dragging)return;rq=requestAnimationFrame(()=>{rq=0;build();if(!editing)render();else{const a=document.activeElement;if(!(a&&a.closest&&a.closest('[data-add]')))render()}})};
function watchUser(u){if(subs[u])return;subs[u]=1;
 db.collection(`t/${u}/ov`).onSnapshot(s=>{OV[u]={};s.docs.forEach(d=>OV[u][d.id]=d.data());later()},()=>{});
 db.collection(`t/${u}/n`).onSnapshot(s=>{NV[u]=s.docs.map(d=>({id:d.id,...d.data()}));later()},()=>{})}
async function resolveNames(){if(!user)return;const ids=Object.keys(PED).filter(u=>PED[u]&&PED[u].p&&!names[u]);if(!ids.length)return;
 try{const ps=await user.profiles(ids);for(const i of ids)names[i]=(ps[i]&&ps[i].name)||'';later()}catch(e){}}
render();
let timer=0;
(async()=>{
 try{user=await window.claude?.use?.('user')}catch(e){user=null}
 try{db=await window.claude?.use?.('db')}catch(e){db=null}
 try{AUDIO=await window.claude?.use?.('audio')}catch(e){AUDIO=null}
 try{PUSH=await window.claude?.use?.('push');if(PUSH&&notifOn)PUSH.ligar().catch(()=>{})}catch(e){PUSH=null}
 if(user){try{uid=await user.id()}catch(e){}try{admin=!!(await user.canEdit())}catch(e){}}
 if(!db){clearTimeout(timer);offline=true;loaded=true;render();return}
 timer=setTimeout(()=>{if(!loaded){offline=true;loaded=true;render()}},10000);
 let got=0;const ready=()=>{if(++got>=2){loaded=true;offline=false;clearTimeout(timer)}};
 db.collection('membros').onSnapshot(s=>{MEM={};s.docs.forEach(d=>{const v=d.data();if(v&&v.p&&P.some(p=>p.id===v.p))MEM[d.id]=v.p});
  me=uid?MEM[uid]||null:null;if(me&&view==='meu'&&false)view='meu';
  Object.keys(MEM).forEach(watchUser);if(uid)watchUser(uid);watchDms();if(!s.metadata?.fromCache)ready();later()},()=>{clearTimeout(timer);offline=true;loaded=true;render()});
 db.collection('pedidos').onSnapshot(s=>{PED={};s.docs.forEach(d=>PED[d.id]=d.data());resolveNames();later()},()=>{});
 db.collection('tasks').onSnapshot(s=>{TB=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata?.fromCache)ready();later()},()=>{clearTimeout(timer);offline=true;loaded=true;render()});
 db.collection('ideias').onSnapshot(s=>{const old=IDE;IDE=s.docs.map(d=>({id:d.id,...d.data()}));if(me===JH){const nw=IDE.filter(i=>i.por!==me&&(i.criado||0)>lastSeenAt&&!old.some(o=>o.id===i.id));if(nw.length)notify(nw.map(i=>({titulo:'Nova ideia de '+per(i.de).n,corpo:i.titulo,tag:'ide'+i.id})))}later()},()=>{});
 db.collection('grupos').onSnapshot(s=>{GRP=s.docs.map(d=>({id:d.id,...d.data()}));watchGroups();later()},()=>{});
 db.collection('grupo/geral/m').onSnapshot(s=>{const old=GR;GR=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at);const nw=GR.filter(m=>m.p!==me&&m.at>lastSeenAt&&!old.some(o=>o.id===m.id));if(nw.length)notify(nw.map(m=>({titulo:'Equipa · '+per(m.p).n,corpo:m.t||'🎙 Mensagem de voz',tag:'grupo',k:'grupo'})));const np=GR.filter(m=>m.p!==me&&m.at>BOOT&&!old.some(o=>o.id===m.id));if(np.length)showPeek('grupo',np[np.length-1]);later()},()=>{});
 if(uid)db.collection(`data/users/${uid}`).onSnapshot(s=>{if(dragging)return;const ed=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.pit;PI=s.docs.filter(d=>d.id.startsWith('pi_')).map(d=>{const v={id:d.id,...d.data()};if(ed===d.id){const cur=PI.find(x=>x.id===d.id);if(cur)v.t=cur.t}return v});later()},()=>{});
 if(uid){lidRef=`data/users/${uid}/lidos`;db.doc(lidRef).onSnapshot(d=>{const v=d&&d.exists?d.data():null;LID=(v&&v.k)||{};later()},()=>{})}
})();
})();
</script>
